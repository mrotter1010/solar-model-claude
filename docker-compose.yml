services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      - DATABASE_URL=postgresql://solar:solar@timescaledb:5432/solar_model
      - API_KEY=${API_KEY:-}
      - NSRDB_API_KEY=${NSRDB_API_KEY:-}
      - NSRDB_API_EMAIL=${NSRDB_API_EMAIL:-}
      - UPLOAD_DIR=/app/uploads
    networks:
      - vantyra-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      timescaledb:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5}
      - ANALYSIS_API_URL=http://api:8000
      - ANALYSIS_API_KEY=${API_KEY:-}
      - DATABASE_URL=postgresql://solar:solar@timescaledb:5432/solar_model
      - REQUEST_TIMEOUT=120
      - SESSION_TTL_MINUTES=60
      - MAX_PLAN_STEPS=10
    networks:
      - vantyra-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - api
      - timescaledb

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=solar
      - POSTGRES_PASSWORD=solar
      - POSTGRES_DB=solar_model
    networks:
      - vantyra-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar_model"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

networks:
  vantyra-net:
    external: true
